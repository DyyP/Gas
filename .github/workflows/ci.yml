name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit-, Backend- und Repo-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bündel aktuell?
        run: node tools/bundle.mjs --check
      - name: Tests
        run: node --test "tests/**/*.test.mjs"

  e2e:
    name: Browser-Test (Chromium, iPhone-Größe)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright installieren
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: E2E
        run: node --test tests/e2e/app.e2e.mjs
